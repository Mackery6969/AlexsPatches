version: 2

updates:
  # Dependencies for the newest supported Minecraft version
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "main"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "automation"
      - "minecraft: latest"

    commit-message:
      prefix: "deps"
      include: "scope"

    groups:
      minor-and-patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Bundled with Minecraft; the game ships and pins its own copy
      - dependency-name: "org.lz4:lz4-java"

      - dependency-name: "net.neoforged:*"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "net.neoforged.gradle*"
        update-types:
          - "version-update:semver-major"

      # Bundled by NeoForge/Minecraft for the server console; not declared or shipped by this mod
      - dependency-name: "org.jline:jline-reader"

      # Bundled with Minecraft; the game ships and pins its own copy
      - dependency-name: "org.apache.logging.log4j:log4j-core"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "America/Chicago"

    labels:
      - "dependencies"
      - "github-actions"
      - "automation"

    commit-message:
      prefix: "ci"

    groups:
      github-actions:
        patterns:
          - "*"
